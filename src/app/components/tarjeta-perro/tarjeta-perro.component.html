<ion-card style="margin: 4px; position: relative;">
  <div style="position: relative;">
    <img [src]="perro.foto" [alt]="perro.nombre" style="width: 100%; height: 140px; object-fit: cover;" />

    @if (perro.adoptado) {
      <div style="position: absolute; top: 8px; left: 8px; background: #2dd36f; color: white; 
        padding: 2px 10px; border-radius: 20px; font-size: 11px; font-weight: 600;">
        ✓ Adoptado
      </div>
    } @else {
      <div style="position: absolute; top: 8px; left: 8px; background: #6a5cf5; color: white; 
        padding: 2px 10px; border-radius: 20px; font-size: 11px; font-weight: 600;">
        Disponible
      </div>
    }
  </div>

  <ion-card-header>
    <ion-card-title style="font-size: 16px;">{{ perro.nombre }}</ion-card-title>
    <ion-card-subtitle>{{ perro.raza }} · {{ perro.edad }} años</ion-card-subtitle>
  </ion-card-header>
</ion-card>
